<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pflanzen-Lernkarten – KK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Start-/Willkommensbereich -->
  <div id="landing">
    <h1>Pflanzen-Lernkarten</h1>
    <p>Wähle eine Schwierigkeitsstufe, um zu starten:</p>

    <div class="mode-grid">
      <button
        class="mode-btn"
        data-mode="einfach"
        onclick="window.startMode && window.startMode('einfach')">
        Einfach
      </button>
      <button
        class="mode-btn"
        data-mode="mittel"
        onclick="window.startMode && window.startMode('mittel')">
        Mittel
      </button>
      <button
        class="mode-btn"
        data-mode="schwer"
        onclick="window.startMode && window.startMode('schwer')">
        Schwer
      </button>
      <button
        class="mode-btn"
        data-mode="custom"
        onclick="window.startMode && window.startMode('custom')">
        Eigenes Lernen
      </button>
    </div>
  </div>

  <!-- Lernbereich -->
  <div id="app" class="hidden">
    <header>
      <h2>Pflanzen-Lernkarten – Kartenset</h2>
      <div class="top-bar">
        <label for="levelSelect">Schwierigkeitsstufe:</label>
        <select id="levelSelect">
          <option value="einfach">Einfach</option>
          <option value="mittel">Mittel</option>
          <option value="schwer">Schwer</option>
        </select>
        <button id="restartBtn">Neustart</button>
      </div>
    </header>

    <main>
      <section id="learningArea">
        <div id="cardContainer"></div>
        <div id="cardCounter"></div>
        <div id="feedback" class="feedback"></div>

        <div class="controls">
          <button id="checkBtn">Überprüfen</button>
          <button id="nextBtn">Nächste Karte</button>
        </div>
      </section>

      <aside id="optionsArea">
        <h3>Antwortmöglichkeiten</h3>
        <div id="optionsList" class="options-list"></div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
